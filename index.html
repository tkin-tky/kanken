<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#2a1a0a"/>
  <title>四字熟語 — 一字穴埋め</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
/* ============================================================
   TOKENS
============================================================ */
:root{
  --washi:   #f5ede0;       /* 和紙ベース */
  --washi2:  #ede1cf;       /* 少し濃い和紙 */
  --ink:     #1a100a;       /* 墨 */
  --ink2:    rgba(26,16,10,.65);
  --vermil:  #c0392b;       /* 朱 */
  --vermil2: #e74c3c;
  --gold:    #b5892a;       /* 金 */
  --gold2:   #d4a843;
  --panel:   rgba(255,248,238,.82);
  --shadow:  rgba(26,16,10,.18);
  --good:    #27ae60;
  --bad:     #c0392b;

  --safeT: env(safe-area-inset-top,0px);
  --safeR: env(safe-area-inset-right,0px);
  --safeB: env(safe-area-inset-bottom,0px);
  --safeL: env(safe-area-inset-left,0px);

  --font-serif: 'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}

/* ============================================================
   BASE
============================================================ */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }

html,body{
  width:100%; height:100%;
  overflow:hidden;
  font-family: var(--font-serif);
  color: var(--ink);
  background: var(--washi);
}

/* ============================================================
   SEIGAIHA WAVE BACKGROUND (CSS only)
============================================================ */
body{
  background-color: var(--washi2);
  background-image:
    /* 青海波パターン */
    radial-gradient(ellipse 70px 50px at 50px 50px, transparent 49%, rgba(181,137,42,.13) 49%, rgba(181,137,42,.13) 51%, transparent 51%),
    radial-gradient(ellipse 70px 50px at 120px 50px, transparent 49%, rgba(181,137,42,.13) 49%, rgba(181,137,42,.13) 51%, transparent 51%),
    radial-gradient(ellipse 70px 50px at 85px 26px, transparent 49%, rgba(181,137,42,.10) 49%, rgba(181,137,42,.10) 51%, transparent 51%),
    /* 和紙グラデ */
    radial-gradient(ellipse 110% 60% at 25% 15%, rgba(255,240,210,.60), transparent 60%),
    radial-gradient(ellipse 80% 70% at 80% 85%, rgba(192,57,43,.07), transparent 60%),
    linear-gradient(160deg, #f5ede0 0%, #ede1cf 55%, #e8d9c0 100%);
  background-size: 70px 50px, 70px 50px, 70px 50px, auto, auto, auto;
  background-attachment: fixed;
}

/* 半透明の霞 */
body::before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(192,57,43,.06), transparent 55%),
    radial-gradient(ellipse 50% 40% at 15% 85%, rgba(181,137,42,.06), transparent 55%);
  pointer-events:none; z-index:0;
}

/* ============================================================
   LAYOUT
============================================================ */
#wrap{
  position:fixed; inset:0;
  padding: calc(6px + var(--safeT)) calc(6px + var(--safeR)) calc(6px + var(--safeB)) calc(6px + var(--safeL));
  display:flex; flex-direction:column;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  z-index:1;
  gap:8px;
}

/* ============================================================
   HEADER — 掛軸風タイトル
============================================================ */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px 4px;
  position:relative;
}
.topbar::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:0;
  height:2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--vermil), var(--gold), transparent);
}

.title-block{ display:flex; flex-direction:column; gap:2px; }

h1{
  font-size: clamp(18px, 5vw, 26px);
  font-weight:900;
  letter-spacing:.14em;
  color: var(--ink);
  line-height:1.1;
}
/* 金の下線 */
h1 span{
  display:inline-block;
  background: linear-gradient(90deg, var(--gold), var(--vermil));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.sub{
  font-size:11px;
  color: var(--ink2);
  letter-spacing:.1em;
}

/* 問題番号・レベルバッジ */
.stats{ display:flex; gap:6px; flex-shrink:0; }
.badge{
  display:flex; flex-direction:column; align-items:center;
  background: var(--panel);
  border:1px solid rgba(181,137,42,.35);
  border-radius:8px;
  padding:4px 10px;
  box-shadow: 0 4px 12px var(--shadow), inset 0 1px 0 rgba(255,255,255,.6);
  min-width:56px;
}
.badge .bk{ font-size:9px; color:var(--ink2); letter-spacing:.06em; }
.badge .bv{ font-size:18px; font-weight:900; color:var(--ink); line-height:1.1; }

/* ============================================================
   PANEL — 和紙パネル
============================================================ */
.panel{
  background: var(--panel);
  border:1px solid rgba(181,137,42,.30);
  border-radius:14px;
  padding:12px;
  box-shadow:
    0 6px 20px var(--shadow),
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -1px 0 rgba(181,137,42,.12);
  position:relative;
}
/* 角の家紋風装飾 */
.panel::before, .panel::after{
  content:"◆";
  position:absolute;
  font-size:7px;
  color: rgba(181,137,42,.55);
  pointer-events:none;
}
.panel::before{ top:5px; left:7px; }
.panel::after{  top:5px; right:7px; }

/* ============================================================
   CONTROLS
============================================================ */
.controls{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.ctrl-label{
  display:flex; flex-direction:column; gap:4px; flex:1; min-width:160px;
}
.ctrl-label span{
  font-size:11px; color:var(--ink2); letter-spacing:.08em;
}
.wf-select{
  appearance:none;
  border:1px solid rgba(181,137,42,.40);
  background: rgba(255,248,235,.85);
  color:var(--ink);
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
  font-family: var(--font-serif);
  font-weight:700;
  width:100%;
  outline:none;
  box-shadow: 0 3px 8px var(--shadow), inset 0 1px 0 rgba(255,255,255,.5);
}

.btns-row{ display:flex; gap:6px; flex-wrap:wrap; }

.wf-btn{
  font-family: var(--font-serif);
  font-size:13px; font-weight:900;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  letter-spacing:.06em;
  transition: transform .1s, filter .1s;
  white-space:nowrap;
}
.wf-btn:active{ transform:translateY(1px); }
.wf-btn:disabled{ opacity:.45; cursor:not-allowed; }

.wf-btn.primary{
  background: linear-gradient(160deg, #c0392b, #922b21);
  color:#fff;
  border:1px solid rgba(0,0,0,.18);
  box-shadow: 0 4px 14px rgba(192,57,43,.38), inset 0 1px 0 rgba(255,255,255,.28);
}
.wf-btn.warn{
  background: linear-gradient(160deg, #d4a843, #b5892a);
  color:#1a100a;
  border:1px solid rgba(0,0,0,.14);
  box-shadow: 0 4px 12px rgba(181,137,42,.30), inset 0 1px 0 rgba(255,255,255,.30);
}
.wf-btn.plain{
  background: rgba(255,248,235,.90);
  color:var(--ink);
  border:1px solid rgba(181,137,42,.35);
  box-shadow: 0 3px 8px var(--shadow);
}
.wf-btn.good{
  background: linear-gradient(160deg, #27ae60, #1e8449);
  color:#fff;
  border:1px solid rgba(0,0,0,.14);
  box-shadow: 0 4px 14px rgba(39,174,96,.30), inset 0 1px 0 rgba(255,255,255,.25);
}

/* ============================================================
   QUESTION SECTION
============================================================ */
.qsection{ display:flex; flex-direction:column; gap:8px; }

/* タイマー行 */
.timer-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:4px 2px;
}
.qtitle{ font-size:13px; font-weight:700; letter-spacing:.06em; }
.qdesc{ font-size:11px; color:var(--ink2); margin-top:2px; }
.timer-wrap{ text-align:right; }
.time{
  font-size:clamp(22px, 6vw, 30px);
  font-weight:900;
  color:var(--vermil);
  letter-spacing:.04em;
}
.thint{ font-size:10px; color:var(--ink2); margin-top:2px; }

/* ============================================================
   四字熟語セル — 掛軸風
============================================================ */
.idiom-wrap{
  display:flex; justify-content:center; align-items:center;
  gap:clamp(6px,2vw,14px);
  padding:14px 8px;
  border-radius:12px;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(181,137,42,.06) 0px, rgba(181,137,42,.06) 1px,
      transparent 1px, transparent 20px
    ),
    rgba(255,248,230,.70);
  border:1px solid rgba(181,137,42,.22);
  position:relative;
  overflow:hidden;
}
/* 縦の飾り線 */
.idiom-wrap::before, .idiom-wrap::after{
  content:"";
  position:absolute; top:6px; bottom:6px;
  width:1px;
  background: linear-gradient(180deg, transparent, rgba(181,137,42,.25), transparent);
}
.idiom-wrap::before{ left:10px; }
.idiom-wrap::after{ right:10px; }

.kanji-cell{
  width:  clamp(62px, 17vw, 86px);
  height: clamp(62px, 17vw, 86px);
  display:grid; place-items:center;
  border-radius:10px;
  font-size: clamp(36px, 10vw, 52px);
  font-weight:900;
  background: rgba(255,252,242,.88);
  border:1px solid rgba(181,137,42,.30);
  box-shadow:
    0 4px 12px rgba(26,16,10,.12),
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -2px 0 rgba(181,137,42,.14);
  position:relative;
}
/* 升目の格子補助線 */
.kanji-cell::before{
  content:"";
  position:absolute; inset:20%;
  border:1px solid rgba(181,137,42,.10);
  pointer-events:none;
}

.kanji-cell.blank{
  background: rgba(192,57,43,.09);
  border:2px dashed rgba(192,57,43,.55);
  box-shadow: 0 0 0 3px rgba(192,57,43,.10), 0 4px 12px rgba(26,16,10,.10);
  color: rgba(192,57,43,.55);
  animation: blinkBorder 1.6s ease-in-out infinite;
}
@keyframes blinkBorder{
  0%,100%{ box-shadow: 0 0 0 3px rgba(192,57,43,.10), 0 4px 12px rgba(26,16,10,.10); }
  50%{     box-shadow: 0 0 0 5px rgba(192,57,43,.20), 0 6px 16px rgba(26,16,10,.14); }
}

/* ============================================================
   CHOICES — 選択肢ボタン
============================================================ */
.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.choice{
  height: clamp(64px, 17vw, 84px);
  border-radius:12px;
  font-size: clamp(34px, 9vw, 48px);
  font-weight:900;
  font-family: var(--font-serif);
  background: rgba(255,252,242,.88);
  border:1px solid rgba(181,137,42,.28);
  cursor:pointer;
  user-select:none;
  display:grid; place-items:center;
  box-shadow:
    0 5px 14px rgba(26,16,10,.12),
    inset 0 1px 0 rgba(255,255,255,.70),
    inset 0 -2px 0 rgba(181,137,42,.12);
  transition: transform .10s, box-shadow .10s;
  touch-action:manipulation;
  position:relative;
  overflow:hidden;
  color: var(--ink);
}
/* 和風のリップル（pseudo-element 装飾） */
.choice::after{
  content:"";
  position:absolute; inset:-2px;
  border-radius:12px;
  opacity:0;
  transition:opacity .12s;
  background: radial-gradient(circle at 50% 50%, rgba(181,137,42,.18), transparent 68%);
}
.choice:active{ transform:translateY(2px); box-shadow:0 2px 6px rgba(26,16,10,.12); }
.choice:active::after{ opacity:1; }
.choice:disabled{ opacity:.55; cursor:not-allowed; }

.choice.good{
  background: rgba(39,174,96,.14);
  border:2px solid rgba(39,174,96,.55);
  color: #1e6e40;
  box-shadow: 0 0 0 4px rgba(39,174,96,.15), 0 5px 14px rgba(26,16,10,.10);
}
.choice.bad{
  background: rgba(192,57,43,.12);
  border:2px solid rgba(192,57,43,.50);
  color: var(--bad);
  box-shadow: 0 0 0 4px rgba(192,57,43,.12), 0 5px 14px rgba(26,16,10,.10);
}

/* ============================================================
   FEEDBACK
============================================================ */
.feedback{
  min-height:32px;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(15px,4.5vw,20px);
  font-weight:900;
  letter-spacing:.10em;
  color:var(--ink2);
}
.feedback.ok  { color:var(--good); }
.feedback.bad { color:var(--bad);  }

/* ============================================================
   PROGRESS ROW
============================================================ */
.prog-section{ display:flex; flex-direction:column; gap:6px; }
.prog-header{
  display:flex; justify-content:space-between; align-items:center;
}
.prog-title{ font-size:12px; font-weight:700; letter-spacing:.08em; }
.status-label{ font-size:11px; color:var(--ink2); }

.progress{
  display:flex; gap:5px; flex-wrap:nowrap; justify-content:center;
}
.dot{
  flex:1; max-width:34px;
  height:32px;
  border-radius:7px;
  border:1px solid rgba(181,137,42,.28);
  background:rgba(255,248,235,.80);
  display:grid; place-items:center;
  font-size:11px; font-weight:700;
  color:var(--ink2);
  box-shadow:0 2px 6px var(--shadow);
  transition:background .2s, border-color .2s;
}
.dot.done{ background:rgba(39,174,96,.20); border-color:rgba(39,174,96,.40); color:#1e6e40; }
.dot.bad{  background:rgba(192,57,43,.18); border-color:rgba(192,57,43,.38); color:#922b21; }
.dot.now{
  background:rgba(192,57,43,.16);
  border-color:rgba(192,57,43,.55);
  color:var(--vermil);
  box-shadow:0 0 0 3px rgba(192,57,43,.15), 0 2px 6px var(--shadow);
  font-weight:900;
}

/* ============================================================
   LOG
============================================================ */
.log{
  background: var(--panel);
  border:1px solid rgba(181,137,42,.25);
  border-radius:12px;
  padding:10px 12px;
  box-shadow:0 4px 12px var(--shadow);
  flex:1;
  overflow:hidden;
}
.log h3{
  font-size:12px; font-weight:700;
  letter-spacing:.08em;
  margin-bottom:6px;
  color:var(--ink2);
  border-bottom:1px solid rgba(181,137,42,.20);
  padding-bottom:4px;
}
.log-line{
  font-size:11px;
  color:var(--ink2);
  line-height:1.6;
  padding:2px 0;
  border-bottom:1px dashed rgba(181,137,42,.14);
}
.log-line:last-child{ border-bottom:none; }

/* ============================================================
   FOOTER
============================================================ */
.footer{
  text-align:center;
  font-size:10px;
  color:var(--ink2);
  padding:2px 0 4px;
  letter-spacing:.08em;
  flex-shrink:0;
}

/* ============================================================
   RESULT OVERLAY
============================================================ */
#overlay{
  position:fixed; inset:0;
  display:none;
  align-items:center; justify-content:center;
  padding:16px;
  background:rgba(26,16,10,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
}
.result-card{
  width:100%; max-width:400px;
  border-radius:20px;
  background: linear-gradient(160deg, #fdf6e8, #f5ede0);
  border:2px solid rgba(181,137,42,.45);
  padding:20px;
  box-shadow:0 30px 80px rgba(26,16,10,.45), inset 0 1px 0 rgba(255,255,255,.6);
  position:relative;
  overflow:hidden;
}
/* 和風コーナー飾り */
.result-card::before{
  content:"";
  position:absolute; top:0; left:0; right:0;
  height:4px;
  background:linear-gradient(90deg, var(--vermil), var(--gold), var(--vermil));
}
.result-card::after{
  content:"";
  position:absolute; bottom:0; left:0; right:0;
  height:4px;
  background:linear-gradient(90deg, var(--gold), var(--vermil), var(--gold));
}

.result-card h2{
  font-size:clamp(18px,5vw,24px);
  font-weight:900;
  letter-spacing:.10em;
  margin-bottom:6px;
  text-align:center;
}
.praise{
  font-size:clamp(22px,6vw,30px);
  font-weight:900;
  text-align:center;
  letter-spacing:.06em;
  padding:10px 0 8px;
  color:var(--vermil);
  border-bottom:2px solid rgba(181,137,42,.25);
  margin-bottom:10px;
}
.result-big{
  font-size:clamp(16px,4.5vw,20px);
  font-weight:900;
  letter-spacing:.04em;
  margin-bottom:4px;
  text-align:center;
}
.result-detail{
  font-size:11px;
  color:var(--ink2);
  line-height:1.8;
  white-space:pre-line;
  background:rgba(255,248,230,.60);
  border:1px solid rgba(181,137,42,.18);
  border-radius:8px;
  padding:8px 10px;
  margin-top:8px;
  max-height:180px;
  overflow-y:auto;
}
.result-actions{
  display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
  margin-top:14px;
}

/* ============================================================
   ERROR BAR
============================================================ */
#errBar{
  position:fixed; left:8px; right:8px; top:8px; z-index:999;
  display:none;
  background:rgba(255,248,238,.95);
  border:2px solid rgba(192,57,43,.40);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(26,16,10,.20);
  color:var(--ink);
}
#errBar b{ color:var(--vermil); }

/* ============================================================
   ANIMATIONS
============================================================ */
@keyframes fadeSlideUp{
  from{ opacity:0; transform:translateY(10px); }
  to{   opacity:1; transform:translateY(0); }
}
.panel, .qsection, .prog-section{ animation:fadeSlideUp .35s ease-out both; }

@keyframes correctPop{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.18) rotate(-2deg); }
  70%{ transform:scale(.95) rotate(1deg); }
  100%{ transform:scale(1); }
}
.cell-pop{ animation:correctPop .32s ease-out; }

/* 桜の花びら（CSSアニメ） */
.petal{
  position:fixed;
  font-size:18px;
  pointer-events:none;
  z-index:9999;
  animation:petalFall 1.4s ease-out forwards;
}
@keyframes petalFall{
  0%  { opacity:0; transform:translate(0,0) rotate(0deg)   scale(.5); }
  15% { opacity:1; }
  100%{ opacity:0; transform:translate(var(--dx),80px) rotate(200deg) scale(1.1); }
}

/* ============================================================
   REDUCE MOTION
============================================================ */
@media(prefers-reduced-motion:reduce){
  .panel,.qsection,.prog-section{ animation:none; }
  .kanji-cell.blank{ animation:none; }
  .petal{ display:none; }
}
  </style>
</head>

<body>
<div id="errBar"></div>

<div id="wrap">

  <!-- ===== HEADER ===== -->
  <div class="topbar">
    <div class="title-block">
      <h1><span>四字熟語</span>を答えよう！</h1>
      <div class="sub">一字穴埋め・全10問</div>
    </div>
    <div class="stats">
      <div class="badge">
        <span class="bk">問題</span>
        <span class="bv"><span id="qIndex">1</span>/10</span>
      </div>
      <div class="badge">
        <span class="bk">Lv.</span>
        <span class="bv" id="lvlLabel">1</span>
      </div>
    </div>
  </div>

  <!-- ===== CONTROLS ===== -->
  <div class="panel" style="animation-delay:.04s">
    <div class="controls">
      <div class="ctrl-label">
        <span>難易度を選択</span>
        <select id="levelSelect" class="wf-select">
          <option value="1">一の巻（漢検10級）</option>
          <option value="2">二の巻（漢検9級）</option>
          <option value="3">三の巻（漢検8級）</option>
          <option value="4">四の巻（漢検7級）</option>
          <option value="5">五の巻（漢検6級）</option>
          <option value="6">六の巻（漢検5級）</option>
          <option value="7">七の巻（漢検4級）</option>
          <option value="8">八の巻（漢検3級）</option>
          <option value="9">九の巻（漢検準2〜2級）</option>
          <option value="10">奥の巻（漢検準1〜1級）</option>
        </select>
      </div>
      <div class="btns-row">
        <button id="startBtn"   class="wf-btn primary">開始</button>
        <button id="pauseBtn"   class="wf-btn warn"    disabled>⏸ 停止</button>
        <button id="restartBtn" class="wf-btn plain"   disabled>🔁 再試</button>
      </div>
    </div>
  </div>

  <!-- ===== QUESTION ===== -->
  <div class="qsection panel" style="animation-delay:.08s">

    <!-- タイマー行 -->
    <div class="timer-row">
      <div>
        <div class="qtitle">□に入る漢字を選べ</div>
        <div class="qdesc">選択肢は四つ。素早く答えよ。</div>
      </div>
      <div class="timer-wrap">
        <div class="time" id="timeLabel">0.000</div>
        <div class="thint" id="timeHint">開始を待て</div>
      </div>
    </div>

    <!-- 四字熟語 -->

  try{ errBar.style.display="block"; errBar.innerHTML="<b>エラー:</b> "+String(msg).replace(/</g,"&lt;").replace(/>/g,"&gt;"); }catch(e){}
}

/* ====== 桜の花びら VFX ====== */
function sakuraAt(x,y,n){
  var petals=["🌸","🌺","✿","❀","🍀"];
  for(var i=0;i<n;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement("div");
        el.className="petal";
        el.textContent=petals[Math.floor(Math.random()*petals.length)];
        el.style.left=(x+(Math.random()-.5)*60)+"px";
        el.style.top=y+"px";
        el.style.setProperty("--dx",((Math.random()-.5)*80)+"px");
        el.style.animationDelay="0s";
        document.body.appendChild(el);
        setTimeout(function(){ el.remove(); },1500);
      }, i*60);
    })(i);
  }
}

/* ====== DOM refs ====== */
function $id(id){ return document.getElementById(id); }
var levelSelect=$id('levelSelect'), startBtn=$id('startBtn'), pauseBtn=$id('pauseBtn'), restartBtn=$id('restartBtn');
var qIndexEl=$id('qIndex'), lvlLabelEl=$id('lvlLabel'), timeLabel=$id('timeLabel'), timeHint=$id('timeHint');
var feedback=$id('feedback'), statusLabel=$id('statusLabel');
var cells=[$id('c0'),$id('c1'),$id('c2'),$id('c3')];
var choiceBtns=[$id('ch0'),$id('ch1'),$id('ch2'),$id('ch3')];
var progressEl=$id('progress'), logLines=$id('logLines');
var overlay=$id('overlay'), avgLabel=$id('avgLabel'), scoreLabel=$id('scoreLabel');
var praiseLabel=$id('praiseLabel'), detailLabel=$id('detailLabel');
var playAgainBtn=$id('playAgainBtn'), closeOverlayBtn=$id('closeOverlayBtn');

/* ====== Game state ====== */
var level=1, gameActive=false, paused=false;
var questions=[], qIdx=0, blankPos=3, correctChar="", results=[];
var qStart=0, pauseStart=0, pausedAccum=0, rafId=0;

function fmtSec(ms){ return (ms/1000).toFixed(3)+"s"; }

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

function buildKanjiPool(lv){
  var set={}, src=idiomsByLevel[lv]||[];
  for(var i=0;i<src.length;i++){ var s=src[i]; for(var k=0;k<s.length;k++) set[s.charAt(k)]=true; }
  delete set["□"];
  var out=[]; for(var key in set){ if(set.hasOwnProperty(key)) out.push(key); }
  return out;
}

function pick10(lv){
  var src=idiomsByLevel[lv]||[];
  if(!src.length) return [];
  var bag=shuffle(src), out=[];
  while(out.length<10){ if(!bag.length) bag=shuffle(src); out.push(bag.pop()); }
  return out;
}

function makeChoices(lv,correct){
  var pool=buildKanjiPool(lv), set=[correct];
  while(set.length<4){ var p=pool[Math.floor(Math.random()*pool.length)]; if(p&&p!==correct&&set.indexOf(p)===-1) set.push(p); }
  return shuffle(set);
}

function setChoicesEnabled(on){
  for(var i=0;i<choiceBtns.length;i++) choiceBtns[i].disabled=!on;
}

function renderProgress(){
  progressEl.innerHTML="";
  for(var i=0;i<10;i++){
    var d=document.createElement('div');
    d.className="dot"+(i===qIdx&&gameActive?" now":"");
    d.textContent=String(i+1);
    if(results[i]){
      d.className="dot"+(results[i].correct?" done":" bad");
    }
    progressEl.appendChild(d);
  }
}

function pushLog(text){
  var line=document.createElement('div');
  line.className="log-line"; line.textContent=text;
  logLines.insertBefore(line,logLines.firstChild);
  while(logLines.children.length>10) logLines.removeChild(logLines.lastChild);
}

function stopRAF(){ if(rafId){ cancelAnimationFrame(rafId); rafId=0; } }

function updateTimer(){
  if(!gameActive){ timeLabel.textContent="0.000"; return; }
  var now=performance.now();
  var elapsed=paused?(pauseStart-qStart-pausedAccum):(now-qStart-pausedAccum);
  if(elapsed<0) elapsed=0;
  timeLabel.textContent=(elapsed/1000).toFixed(3);
  rafId=requestAnimationFrame(updateTimer);
}

function setIdiomCells(idiom){
  for(var i=0;i<4;i++){
    cells[i].className="kanji-cell";
    if(i===blankPos){
      cells[i].textContent="□";
      cells[i].className+=" blank";
    }else{
      cells[i].textContent=idiom.charAt(i);
    }
  }
}

function startQuestion(){
  feedback.textContent="—"; feedback.className="feedback";
  var idiom=questions[qIdx];
  blankPos=Math.floor(Math.random()*4);
  correctChar=idiom.charAt(blankPos);
  setIdiomCells(idiom);

  var choices=makeChoices(level,correctChar);
  for(var i=0;i<choiceBtns.length;i++){
    var btn=choiceBtns[i];
    btn.textContent=choices[i];
    btn.className="choice";
    btn.disabled=false;
  }

  paused=false;
  pauseBtn.textContent="⏸ 停止";
  pausedAccum=0;
  qStart=performance.now();
  timeHint.textContent="計測中 — 回答で次へ";
  stopRAF(); updateTimer();

  qIndexEl.textContent=String(qIdx+1);
  lvlLabelEl.textContent=String(level);
  statusLabel.textContent="出題中";
  renderProgress();
}

function praiseByAvg(avgSec){
  if(avgSec<=2.0) return "漢字の神！";
  if(avgSec<=4.0) return "漢字博士！";
  if(avgSec<=6.0) return "なかなかの腕前";
  if(avgSec<=8.0) return "もう少し精進を";
  return "稽古が足りぬ…";
}

function finishGame(){
  gameActive=false;
  setChoicesEnabled(false);
  pauseBtn.disabled=true; restartBtn.disabled=false; startBtn.disabled=false; levelSelect.disabled=false;
  stopRAF(); statusLabel.textContent="完了";

  var total=0;
  for(var i=0;i<results.length;i++) if(results[i]&&typeof results[i].timeMs==="number") total+=results[i].timeMs;
  var avg=total/10, correctCount=0;
  for(var j=0;j<results.length;j++) if(results[j]&&results[j].correct) correctCount++;

  avgLabel.textContent=fmtSec(avg);
  scoreLabel.textContent=String(correctCount);
  praiseLabel.textContent=praiseByAvg(avg/1000);

  var lines=[], pos=["一文字目","二文字目","三文字目","四文字目"];
  for(var k=0;k<results.length;k++){
    var rr=results[k];
    lines.push((k+1)+". "+rr.idiom+"（□:"+ pos[rr.blankPos]+"）回答:"+rr.answer+(rr.correct?" ○":" ×")+"  "+fmtSec(rr.timeMs));
  }
  detailLabel.textContent="（Lv."+level+"）\n\n"+lines.join("\n");
  overlay.style.display="flex";

  /* 桜吹雪 */
  var cx=window.innerWidth/2, cy=window.innerHeight/2;
  sakuraAt(cx,cy,12);
}

function answer(choiceChar){
  if(!gameActive||paused) return;
  var now=performance.now();
  var elapsed=now-qStart-pausedAccum;
  var idiom=questions[qIdx];
  var ok=(choiceChar===correctChar);

  for(var i=0;i<choiceBtns.length;i++){
    var btn=choiceBtns[i]; btn.disabled=true;
    var t=btn.textContent; btn.className="choice";
    if(t===correctChar) btn.className+=" good";
    if(t===choiceChar&&!ok) btn.className+=" bad";
  }

  feedback.textContent=ok?"正解！":"不正解…（正解："+correctChar+"）";
  feedback.className="feedback"+(ok?" ok":" bad");

  if(ok){
    /* 正解セルをポップ */
    cells[blankPos].textContent=correctChar;
    cells[blankPos].className="kanji-cell cell-pop";
    var cellRect=cells[blankPos].getBoundingClientRect();
    sakuraAt(cellRect.left+cellRect.width/2, cellRect.top+cellRect.height/2, 5);
  }

  results[qIdx]={idiom:idiom, blankPos:blankPos, answer:choiceChar, correct:ok, timeMs:Math.max(0,elapsed)};
  renderProgress();
  pushLog((qIdx+1)+"/10  "+(ok?"○":"×")+"  "+idiom+"  "+fmtSec(elapsed));

  stopRAF();
  setTimeout(function(){ qIdx++; if(qIdx>=10) finishGame(); else startQuestion(); }, 540);
}

function startGame(){
  level=parseInt(levelSelect.value,10)||1;
  lvlLabelEl.textContent=String(level);
  questions=pick10(level);
  results=new Array(10); for(var i=0;i<10;i++) results[i]=null;
  qIdx=0; gameActive=true; paused=false;
  overlay.style.display="none";
  startBtn.disabled=true; restartBtn.disabled=false; pauseBtn.disabled=false; levelSelect.disabled=true;
  statusLabel.textContent="開始"; logLines.innerHTML="";
  renderProgress(); startQuestion();
}

function restartGame(){
  if(!levelSelect.disabled){ level=parseInt(levelSelect.value,10)||1; }
  levelSelect.value=String(level);
  startGame();
}

function togglePause(){
  if(!gameActive) return;
  if(!paused){
    paused=true; pauseStart=performance.now();
    pauseBtn.textContent="▶ 再開";
    timeHint.textContent="一時停止中";
    statusLabel.textContent="停止中";
    renderProgress();
  }else{
    pausedAccum+=(performance.now()-pauseStart);
    paused=false;
    pauseBtn.textContent="⏸ 停止";
    timeHint.textContent="計測中 — 回答で次へ";
    statusLabel.textContent="出題中";
    renderProgress();
  }
}

/* ====== bindTap (click + touchend guard) ====== */
function bindTap(el,fn){
  var lock=false;
  el.addEventListener("click",function(e){ fn(e); },false);
  el.addEventListener("touchend",function(e){
    if(lock) return; lock=true; fn(e);
    setTimeout(function(){ lock=false; },250);
  },{passive:true});
}

levelSelect.addEventListener('change',function(){ lvlLabelEl.textContent=String(levelSelect.value); },{passive:true});
bindTap(startBtn,startGame);
bindTap(restartBtn,restartGame);
bindTap(pauseBtn,togglePause);

for(var i=0;i<choiceBtns.length;i++){
  (function(btn){ bindTap(btn,function(){ answer(btn.textContent); }); })(choiceBtns[i]);
}

bindTap(playAgainBtn,function(){ overlay.style.display="none"; levelSelect.value=String(level); startGame(); });
bindTap(closeOverlayBtn,function(){ overlay.style.display="none"; });

renderProgress();
setChoicesEnabled(false);
pauseBtn.disabled=true;
restartBtn.disabled=true;

})();
</script>
